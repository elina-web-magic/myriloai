    <radialGradient gradientTransform="translate(374 374) rotate(-34) scale(188 142)" gradientUnits="userSpaceOnUse" r="1" cy="0" cx="0" id="violetGlow">
      <stop stop-opacity="0.9" stop-color="#A855F7" offset="0"/>
      <stop stop-opacity="0" stop-color="#A855F7" offset="1"/>
    </radialGradient>
    <filter color-interpolation-filters="sRGB" height="140%" width="140%" y="-20%" x="-20%" id="shadow">
      <feDropShadow flood-opacity="0.44" flood-color="#060817" stdDeviation="34" dy="28" dx="0"/>
      <feDropShadow flood-opacity="0.32" flood-color="#38BDF8" stdDeviation="28" dy="0" dx="0"/>
    </filter>
    <filter color-interpolation-filters="sRGB" height="260%" width="260%" y="-80%" x="-80%" id="softGlow">
      <feGaussianBlur result="blur" stdDeviation="8"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="iconClip">
      <rect rx="108" height="400" width="400" y="56" x="56"/>
    </clipPath>
  </defs>
  
