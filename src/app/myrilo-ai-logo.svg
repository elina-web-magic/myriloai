<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="55.296 55.296 401.408 401.408" style="max-height: 500px; background: transparent;" width="401.408" height="401.408">
  <title>Myrilo AI Logo</title>
  <defs>
    <linearGradient gradientUnits="userSpaceOnUse" y2="442" x2="438" y1="66" x1="74" id="aurora">
      <stop stop-color="#2FFFE2" offset="0"/>
      <stop stop-color="#38BDF8" offset="0.38"/>
      <stop stop-color="#8B5CF6" offset="0.72"/>
      <stop stop-color="#D946EF" offset="1"/>
    </linearGradient>
    <linearGradient gradientUnits="userSpaceOnUse" y2="458" x2="452" y1="54" x1="64" id="glass">
      <stop stop-opacity="0.82" stop-color="#FFFFFF" offset="0"/>
      <stop stop-opacity="0.22" stop-color="#B6F6FF" offset="0.46"/>
      <stop stop-opacity="0.18" stop-color="#7C3AED" offset="1"/>
    </linearGradient>
    <radialGradient gradientTransform="translate(166 144) rotate(42) scale(196 148)" gradientUnits="userSpaceOnUse" r="1" cy="0" cx="0" id="mintGlow">
      <stop stop-opacity="0.88" stop-color="#2FFFE2" offset="0"/>
