name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Run Biome (Linter & Formatter)
        run: pnpm biome ci .

      - name: Run Knip (Find Dead Code)
        run: pnpm knip

      - name: Run TypeScript Compiler (Type Checking)
        run: pnpm tsc --noEmit